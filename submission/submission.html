<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CatSkip</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./submission.css">
</head>

<body>
  <div id="overlay-container">
    <div id="engagement-dimmer" aria-hidden="true"></div>
    <div id="engagement-overlay" aria-live="polite">
      <p id="engagement-copy">Click to toss the ball. Keep the cat engaged to skip ad.</p>
    </div>
    <div id="feedback-layer" aria-hidden="true"></div>
    <div id="toy-cursor" aria-hidden="true"></div>
    <div id="cat" aria-hidden="true"></div>
    <div id="toy-ball" aria-hidden="true"></div>
    <button id="skip">Skip Ad</button>

    <div id="engagement-meter">
      <div id="engagement-label">Cat Engagement</div>
      <div id="engagement-bar">
        <div id="engagement-fill"></div>
      </div>
    </div>
  </div>
  <script src="./submission.js"></script>
</body>
</html>
